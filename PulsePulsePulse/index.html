<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Pulse Pulse</title>
<style>
:root{--bg:#f3efe6;--fg:#1b1b22;--muted:#6b6b78;--orb:#0f9b82;--haz:#e0383f;--me:#1b1b22;--card:rgba(255,255,255,.88);box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e17;--fg:#f2f2f7;--muted:#9a9ab0;--orb:#3ef0c8;--haz:#ff5d73;--me:#ffffff;--card:rgba(20,22,36,.88);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e17;--fg:#f2f2f7;--muted:#9a9ab0;--orb:#3ef0c8;--haz:#ff5d73;--me:#ffffff;--card:rgba(20,22,36,.88);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1}
#combo{font-size:14px;color:var(--muted);margin-top:4px;height:18px}
#cbar{width:120px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent);margin-top:4px;overflow:hidden}
#cfill{height:100%;width:0;background:var(--haz)}
#right{text-align:right;font-size:13px;color:var(--muted)}
#bar{width:120px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 15%,transparent);margin-top:6px;overflow:hidden;margin-left:auto}
#fill{height:100%;width:0;background:var(--orb);transition:width .12s}
#bar.ready{animation:glow .6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 12px var(--orb)}}
#pulseBtn{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid var(--orb);background:var(--card);color:var(--fg);font-weight:700;font-size:13px;display:none}
#menu{position:fixed;inset:0;display:flex;padding:20px;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}#menu .card{margin:auto}
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:28px;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
h1{margin:0 0 6px;font-size:36px;letter-spacing:-.03em}
.card p{margin:8px 0;color:var(--muted);line-height:1.45;font-size:15px}
.card b{color:var(--fg)}
h1#title span{display:block;line-height:.95}.btns{display:flex;gap:10px;justify-content:center}.btns .go{margin-top:16px;padding:14px 28px}button.go.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
button.go{margin-top:16px;padding:14px 36px;font-size:17px;font-weight:700;border:0;border-radius:999px;background:var(--fg);color:var(--bg);cursor:pointer}
:root{--gold:#c98a00;--blue:#2b63d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#ffd166;--blue:#7db0ff}}
:root[data-theme="dark"]{--gold:#ffd166;--blue:#7db0ff}
#fx{font-size:13px;font-weight:700;margin-top:6px;min-height:16px}
#pulseBtn.ready{box-shadow:0 0 18px var(--orb);background:var(--orb);color:var(--bg)}
#pulseBtn2{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid var(--orb);background:var(--card);color:var(--fg);font-weight:700;font-size:13px;display:none}
#pulseBtn2.ready{box-shadow:0 0 18px var(--orb);background:var(--orb);color:var(--bg)}
.coop #pulseBtn{right:auto;left:18px}
.coop #pulseBtn,.coop #pulseBtn2{width:110px;height:110px;font-size:16px}
#pick{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:rgba(0,0,0,.4)}
#pick .card{width:100%;max-width:380px}
.pk{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:12px;border:2px solid var(--orb);background:transparent;color:var(--fg);font-size:16px;cursor:pointer}
.pk span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.opt{display:block;margin-top:14px;color:var(--muted);font-size:14px;cursor:pointer}
.big{font-size:56px;font-weight:700;color:var(--fg);margin:4px 0}
#cbar2{width:120px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent);margin:4px 0 0 auto;overflow:hidden}
#cfill2{height:100%;width:0;background:var(--haz)}
#bar2{width:120px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 15%,transparent);margin:6px 0 0 auto;overflow:hidden}
#fill2{height:100%;width:0;background:var(--orb);transition:width .12s}
#bar2.ready{animation:glow .6s infinite alternate}
#score2{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1}
#combo2{font-size:14px;color:var(--muted);margin-top:4px;height:18px}
#h2{text-align:right}
#h1 #bar{margin-left:0}
#mid{text-align:right;font-size:13px;color:var(--muted)}
.coop #mid{text-align:center}
.lab{font-size:12px;font-weight:700;color:var(--muted);height:14px;margin-bottom:2px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div id="h1"><div class="lab" id="lab1"></div><div id="score">0</div><div id="combo"></div><div id="cbar"><div id="cfill"></div></div><div id="bar"><div id="fill"></div></div></div>
  <div id="mid"><div id="best">Best 0</div><div id="tot"></div><div id="fx"></div></div>
  <div id="h2" class="hide"><div class="lab" id="lab2"></div><div id="score2">0</div><div id="combo2"></div><div id="cbar2"><div id="cfill2"></div></div><div id="bar2"><div id="fill2"></div></div></div>
</div>
<button id="pulseBtn">PULSE</button>
<button id="pulseBtn2">PULSE</button>
<div id="pick" class="hide"><div class="card"><h1 style="font-size:30px">Boss down!</h1><p>Pick an upgrade (or press 1, 2, 3)</p><div id="picks"></div></div></div>
<div id="menu">
  <div class="card">
    <h1 id="title"><span style="color:var(--me)">Pulse</span><span style="color:var(--orb)">Pulse</span><span style="color:var(--haz)">Pulse</span></h1>
    <div id="over" class="hide"><div class="big" id="final">0</div><p id="bestMsg"></p></div>
    <div class="btns"><button class="go" id="start">Play</button><button class="go alt" id="start2">2P</button></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr,S=1,coop=false,col={};
function readCols(){const s=getComputedStyle(document.documentElement);['bg','fg','orb','haz','me','muted','gold','blue'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function resize(){dpr=Math.min(devicePixelRatio||1,2);S=coop?Math.min(2.2,Math.max(1,Math.min(innerWidth,innerHeight)/620)):1;W=innerWidth/S;H=innerHeight/S;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr*S,0,0,dpr*S,0,0);readCols()}
addEventListener('resize',resize);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>newPalette());
resize();

function newPalette(){document.documentElement.removeAttribute('style');readCols()}
function newPaletteUnused(){
  const dark=matchMedia('(prefers-color-scheme:dark)').matches,h=Math.random()*360,st=document.documentElement.style;
  const off=[0,90,180,270].sort(()=>Math.random()-.5),hs=(x,sat,l)=>`hsl(${Math.round((h+x)%360)}, ${Math.round(sat)}%, ${l}%)`,set=(k,v)=>st.setProperty('--'+k,v);
  set('bg',hs(Math.random()*40,22+Math.random()*25,dark?9:94));
  set('fg',hs(0,15,dark?95:10));set('me',hs(0,15,dark?97:8));set('muted',hs(0,10,dark?68:42));
  set('orb',hs(off[0],75,dark?60:36));set('haz',hs(off[1],80,dark?62:44));
  set('gold',hs(off[2],85,dark?62:38));set('blue',hs(off[3],80,dark?68:42));
  set('card',`hsla(${Math.round(h)}, 25%, ${dark?12:97}%, .9)`);
  readCols();
}
newPalette();
let best=0;try{best=+localStorage.getItem('pulse-best')||0}catch(e){}
$('best').textContent='Best '+best;

let state='menu',P,pops=[],bosses=[],orbs,haz,parts,rings,score,combo,comboT,charge,t,spawnT,orbT,shake;
const keys={},ptr={x:0,y:0,active:false};
let CHARGE_MAX=4,PL=[],bossKills=0,finale=null;
let bossT=25,bossN=0,smooth=true,pwups=[],pwT=12,fx={speed:0,shield:0},choosing=false,lives=0,cur=[],moveId=null;
const freshUp=()=>({wide:0,quick:0,win:0,mag:0,dmg:0,pw:0,slow:0});
let up=freshUp();
const UPS=[
 {k:'wide',n:'Wide Pulse',d:'Pulse radius +30%',max:4},
 {k:'quick',n:'Quick Charge',d:'Pulse needs 1 fewer orb',max:2},
 {k:'win',n:'Long Combo',d:'Combo timer +0.6s',max:3},
 {k:'mag',n:'Orb Magnet',d:'Orbs are pulled in from farther away',max:3},
 {k:'dmg',n:'Heavy Hitter',d:'Pulse deals +1 damage to bosses',max:2},
 {k:'pw',n:'Power Surge',d:'Power-ups last +3s and spawn sooner',max:3},
 {k:'life',n:'Second Wind',d:'Survive one fatal hit',max:3},
 {k:'slow',n:'Slow Field',d:'Enemies move 12% slower',max:3}
];
const NAMES={wob:'WOBBLER',boom:'BOOMERANG',blink:'BLINKER',orb:'ORBITER',split:'SPLITTER',ghost:'GHOST'};
let seen={};
function moveHaz(h,d){
  h.age+=d;const k=h.kind;
  if(!k||k==='split'){h.x+=h.vx*d;h.y+=h.vy*d;
    if(k==='split'&&h.age>h.life){for(let j=0;j<3;j++){const a=h.ph+j*2.09;haz.push({x:h.x,y:h.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:7,age:0,ph:0})}burst(h.x,h.y,col.haz,16,160);h.dead=true}}
  else if(k==='wob'){const c=Math.cos(h.age*5)*1.3;h.x+=(h.vx-h.vy*c)*d;h.y+=(h.vy+h.vx*c)*d}
  else if(k==='boom'){const p=h.age/h.T;if(p>=1){h.dead=true;return}const o=Math.sin(p*Math.PI)*h.D;h.x=h.sx+h.ux*o;h.y=h.sy+h.uy*o}
  else if(k==='orb'){h.fixed=true;h.ang+=d*2.6;h.cx+=Math.cos(h.ph)*14*d;h.cy+=Math.sin(h.ph)*14*d;h.x=h.cx+Math.cos(h.ang)*h.R;h.y=h.cy+Math.sin(h.ang)*h.R;if(h.age>h.life)h.dead=true}
  else if(k==='blink'){h.fixed=true;h.cd-=d;if(h.cd<=0){h.cd=1.6;const dx=P.x-h.x,dy=P.y-h.y,l=Math.hypot(dx,dy)||1,j=Math.max(0,Math.min(l-80,190));h.x+=dx/l*j;h.y+=dy/l*j;burst(h.x,h.y,col.haz,8,120)}if(h.age>h.life)h.dead=true}
  else if(k==='ghost'){h.fixed=true;const dx=P.x-h.x,dy=P.y-h.y,l=Math.hypot(dx,dy)||1;h.x+=dx/l*70*d;h.y+=dy/l*70*d;h.ghost=Math.sin(h.age*2.2)<0;if(h.age>h.life)h.dead=true}
}
function drawWeird(h){
  const k=h.kind,x=h.x,y=h.y,r=h.r;ctx.save();ctx.fillStyle=col.haz;ctx.strokeStyle=col.haz;
  if(k==='ghost'){ctx.globalAlpha=h.ghost?.22:.9;poly(x,y,r,5,h.age*2);ctx.fill()}
  else if(k==='blink'){ctx.globalAlpha=(h.cd<.5&&Math.sin(h.age*40)>0)?.25:1;ctx.lineWidth=3;poly(x,y,r,4,.785);ctx.stroke();ctx.beginPath();ctx.arc(x,y,3,0,6.283);ctx.fill()}
  else if(k==='orb'){ctx.lineWidth=2;ctx.globalAlpha=.2;ctx.beginPath();ctx.arc(h.cx,h.cy,h.R,0,6.283);ctx.stroke();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
  else if(k==='boom'){ctx.beginPath();for(let i=0;i<3;i++){const a=h.age*8+i*2.094;ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*1.6,y+Math.sin(a)*r*1.6)}ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke()}
  else if(k==='split'){const pr=1+Math.sin(h.age*10)*.12*(h.age/h.life);poly(x,y,r*pr,3,h.age);ctx.fill();ctx.fillStyle=col.bg;ctx.beginPath();ctx.arc(x,y,r*.3,0,6.283);ctx.fill()}
  else{poly(x,y,r*1.15,4,h.age*3);ctx.fill()}
  ctx.restore();
}
function hudFor(pl,s){$('score'+s).textContent=pl.score;$('combo'+s).textContent=pl.combo>1?`combo ×${pl.combo}  ·  +${mult(pl)} per orb`:'';$('cfill'+s).style.width=pl.combo>0?Math.max(0,pl.cT/cWin(pl)*100)+'%':'0';$('fill'+s).style.width=(pl.charge/CHARGE_MAX*100)+'%';$('bar'+s).classList.toggle('ready',pl.charge>=CHARGE_MAX)}
const near=(x,y)=>{let b=null,bd=1e9;for(const p of PL){if(!p.alive)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}return b||PL[0]};
function drawPlayer(pl){
  const i=PL.indexOf(pl);ctx.save();
  if(!pl.alive){ctx.globalAlpha=.5;ctx.strokeStyle=col.haz;ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r+6,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.strokeStyle=col.orb;ctx.lineWidth=4;ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r+12,-1.57,-1.57+pl.rev*6.283);ctx.stroke();ctx.fillStyle=col.muted;ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('P'+(i+1)+' DOWN',pl.x,pl.y-pl.r-18);ctx.restore();return}
  ctx.fillStyle=col.me;
  pl.trail.forEach((p,j)=>{ctx.globalAlpha=j/pl.trail.length*.3;ctx.beginPath();ctx.arc(p.x,p.y,pl.r*(j/pl.trail.length),0,6.283);ctx.fill()});
  ctx.globalAlpha=(pl.inv>0&&Math.sin(t*30)>0)?.35:1;ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r,0,6.283);ctx.fill();
  if(i===1){ctx.fillStyle=col.bg;ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r*.45,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  if(PL.length>1){ctx.fillStyle=col.muted;ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('P'+(i+1),pl.x,pl.y-pl.r-8)}
  if(fx.shield>0){ctx.strokeStyle=col.blue;ctx.lineWidth=3;ctx.globalAlpha=fx.shield<2?(Math.sin(t*20)>0?1:.3):.9;ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r+9,0,6.283);ctx.stroke();ctx.globalAlpha=1}
  if(fx.speed>0){ctx.fillStyle=col.gold;pl.trail.forEach((p,j)=>{ctx.globalAlpha=j/pl.trail.length*.5;ctx.beginPath();ctx.arc(p.x,p.y,pl.r*.8*(j/pl.trail.length),0,6.283);ctx.fill()});ctx.globalAlpha=1}
  if(pl.charge>=CHARGE_MAX){ctx.strokeStyle=col.orb;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r+5+Math.sin(t*10)*2,0,6.283);ctx.stroke()}
  ctx.restore();
}
function offerUpgrade(){
  const taken=k=>k==='life'?lives:up[k];
  const pool=UPS.filter(u=>taken(u.k)<u.max).sort(()=>Math.random()-.5).slice(0,3);
  if(!pool.length)return;
  choosing=true;cur=pool;
  const box=$('picks');box.innerHTML='';
  pool.forEach((u,i)=>{const b=document.createElement('button');b.className='pk';b.innerHTML=`<b>${i+1}. ${u.n}</b><span>${u.d}</span>`;b.onclick=()=>choose(u);box.appendChild(b)});
  $('pick').classList.remove('hide');
}
function choose(u){
  if(!choosing)return;
  if(u.k==='life')lives++;else up[u.k]++;
  if(u.k==='quick'){CHARGE_MAX=Math.max(2,4-up.quick);PL.forEach(q=>q.charge=Math.min(q.charge,CHARGE_MAX))}
  choosing=false;$('pick').classList.add('hide');fx.shield=Math.max(fx.shield,2);
  pops.push({x:W/2,y:140,txt:u.n.toUpperCase(),life:1.5,c:col.orb});
}
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*6.283,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function spawnBoss(){
  const names=['TRIANGLE','SQUARE','HEXAGON'],ty=['tri','sq','hex'],i=bossN++%3,side=Math.random()*4|0,r=32+Math.min(bossN,8)*2,hp=[3,4,6][i],o=r*.8;
  let x,y;
  if(side==0){x=-o;y=Math.random()*H}else if(side==1){x=W+o;y=Math.random()*H}else if(side==2){x=Math.random()*W;y=-o}else{x=Math.random()*W;y=H+o}
  const a=Math.atan2(H/2-y,W/2-x),s=i==1?120:100;
  bosses.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,type:ty[i],hp,max:hp,rot:0,ph:0,flash:0,in:false});
  pops.push({x:W/2,y:120,txt:'BOSS: '+names[i],life:1.8,c:col.haz});
}
function updateBosses(dt){
  for(const b of bosses){
    if(b.dying){b.rot+=dt*3;b.flash=.3;continue}
    b.rot+=dt*(b.type==='hex'?.8:1.3);b.flash=Math.max(0,b.flash-dt);
    P=near(b.x,b.y);const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;
    if(!b.in&&b.x>b.r&&b.x<W-b.r&&b.y>b.r&&b.y<H-b.r)b.in=true;
    if(b.type==='hex'){b.vx+=dx/d*110*dt;b.vy+=dy/d*110*dt;const s=Math.hypot(b.vx,b.vy);if(s>90){b.vx*=90/s;b.vy*=90/s}}
    else if(b.type==='tri'){b.ph+=dt*(fx.speed>0?.3:1);if(b.ph>2.6){b.ph=0;b.vx=dx/d*380;b.vy=dy/d*380}else{const f=1-Math.min(1,dt*.7);b.vx*=f;b.vy*=f}
      if(b.in&&(b.x<-b.r||b.x>W+b.r||b.y<-b.r||b.y>H+b.r)){b.vx=dx/d*120;b.vy=dy/d*120}}
    else if(b.in){if((b.x<b.r&&b.vx<0)||(b.x>W-b.r&&b.vx>0))b.vx*=-1;if((b.y<b.r&&b.vy<0)||(b.y>H-b.r&&b.vy>0))b.vy*=-1}
    const sl=(fx.speed>0?.3:1)*Math.max(.5,1-up.slow*.12);b.x+=b.vx*dt*sl;b.y+=b.vy*dt*sl;
    for(const pl of PL){if(!pl.alive||pl.inv>0)continue;const ex=pl.x-b.x,ey=pl.y-b.y,ed=Math.hypot(ex,ey)||1;if(ed<pl.r+b.r*.85){if(fx.shield<=0){die(pl);if(state!=='play')return;pl.inv=1.5}const need=pl.r+b.r*1.1;b.x=pl.x-ex/ed*need;b.y=pl.y-ey/ed*need}}
  }
}
const mult=q=>Math.min(5,1+Math.floor(q.combo/3));
const cWin=q=>Math.max(1,2-q.combo*0.06)+up.win*.6;

function reset(){
  const mk=x=>({x,y:H/2,r:10,trail:[],alive:true,inv:0,rev:0,score:0,combo:0,cT:0,charge:0,ptr:{x,y:H/2,ox:0,oy:0,cx:x,cy:H/2,tid:null,active:false}});
  PL=coop?[mk(W*.3),mk(W*.7)]:[mk(W/2)];P=PL[0];
  finale=null;orbs=[];haz=[];parts=[];rings=[];pops=[];bosses=[];bossT=25;bossN=0;pwups=[];pwT=12;fx={speed:0,shield:0};up=freshUp();CHARGE_MAX=4;seen={};bossKills=0;choosing=false;lives=0;$('pick').classList.add('hide');
  score=0;combo=0;comboT=0;charge=0;t=0;spawnT=1;orbT=0;shake=0;
  ptr.x=W/2;ptr.y=H/2;ptr.ox=0;ptr.oy=0;moveId=null;
  for(let i=0;i<3;i++)spawnOrb();
}
function spawnOrb(){
  const m=40;orbs.push({x:m+Math.random()*(W-2*m),y:90+Math.random()*(H-90-m),life:5,r:9,ph:Math.random()*6});
}
function spawnHaz(){
  const side=Math.random()*4|0,r=8+Math.random()*9;
  let x,y;

  if((k==='enter')&&state!=='play')start(lastCoop)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const endPtr=e=>{for(const p of PL)if(p.ptr.tid===e.pointerId)p.ptr.tid=null};
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
addEventListener('contextmenu',e=>e.preventDefault());
const blurAll=()=>{PL.forEach(p=>p.ptr.tid=null)};addEventListener('blur',blurAll);
$('start').onclick=()=>start(false);$('start2').onclick=()=>start(true);
$('pulseBtn').addEventListener('pointerdown',e=>{e.stopPropagation();pulse(PL[0])});
$('pulseBtn2').addEventListener('pointerdown',e=>{e.stopPropagation();pulse(PL[1])});
requestAnimationFrame(loop);
</script>
</body>
